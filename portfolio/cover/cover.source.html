<!doctype html>
<!--
  SILOU portfolio covers. Open with ?v=card (1600×1000, 16:10) or ?v=banner (1920×800, 2.4:1)
  and screenshot at deviceScaleFactor 2. Screens come from ../screens, fonts from ./fonts (Geist).
  Look: an ink-indigo pattern-cutting mat, three phones only, a coral hang tag showing the
  app's own flash-deal timer, and a tailor's tape stopped at 172 cm (the height preset on
  the app's My Measurements screen).
-->
<html><head><meta charset="utf-8"><title>SILOU cover</title>
<style>
@font-face{font-family:Geist;src:url(fonts/Geist-Regular.woff2);font-weight:400}
@font-face{font-family:Geist;src:url(fonts/Geist-Medium.woff2);font-weight:500}
@font-face{font-family:Geist;src:url(fonts/Geist-Bold.woff2);font-weight:700}
@font-face{font-family:Geist;src:url(fonts/Geist-Black.woff2);font-weight:900}
@font-face{font-family:GeistMono;src:url(fonts/GeistMono-Medium.woff2);font-weight:500}
:root{--ink:#16112F;--ink2:#0C0A19;--coral:#FF4D3D;--tang:#FF8A00;--violet:#6E4BFF;--mist:#F7F5FF}
*{box-sizing:border-box;margin:0}
html,body{background:var(--ink2)}
.stage{position:relative;overflow:hidden;font-family:Geist,sans-serif;color:#fff;
  background:
    radial-gradient(60% 70% at 78% 62%,rgba(255,77,61,.30),transparent 70%),
    radial-gradient(50% 60% at 10% 0%,rgba(110,75,255,.28),transparent 70%),
    var(--ink)}
/* cutting-mat grid: fine every 20px, stronger every 100px */
.stage::before{content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px}
.card{width:1600px;height:1000px}
.banner{width:1920px;height:800px}
.phone{position:absolute;border-radius:58px;background:#05040b;padding:11px;
  box-shadow:0 50px 90px -30px rgba(0,0,0,.75),0 0 0 1.5px rgba(255,255,255,.14) inset,0 0 0 1px rgba(0,0,0,.6)}
.phone img{display:block;width:100%;border-radius:47px}
.phone::after{content:"";position:absolute;top:22px;left:50%;width:92px;height:26px;margin-left:-46px;border-radius:20px;background:#05040b}
.title{position:absolute;left:96px;top:250px}
.kicker{font-family:GeistMono;font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.word{font-weight:900;font-size:212px;line-height:.9;letter-spacing:-.055em;margin-top:26px}
.word b{color:var(--coral)}
.line{font-size:36px;line-height:1.25;color:rgba(255,255,255,.74);width:560px;margin-top:30px;font-weight:400;letter-spacing:-.01em}
.meta{display:flex;gap:12px;margin-top:40px}
.meta span{font-family:GeistMono;font-size:19px;padding:10px 16px;border:1px solid rgba(255,255,255,.18);border-radius:999px;color:rgba(255,255,255,.78)}
/* tailor's tape */
.tape{position:absolute;height:64px;background:linear-gradient(#FFF6DE,#F3E5BF);color:#3B3560;
  box-shadow:0 18px 30px -16px rgba(0,0,0,.7);display:flex;align-items:flex-start;overflow:hidden}
.tape .cm{flex:0 0 50px;height:100%;position:relative;border-left:2px solid #3B3560}
.tape .cm::before{content:"";position:absolute;left:23px;top:0;width:1.5px;height:16px;background:#3B3560}
.tape .cm i{position:absolute;left:6px;top:24px;font:500 17px GeistMono;font-style:normal}
.tape .cm.hit{background:rgba(255,77,61,.22)}
.tape .cm.hit i{color:var(--coral);font-weight:700}
/* hang tag copied from the app's Flash deals timer */
.tag{position:absolute;width:250px;padding:26px 22px 22px;background:var(--coral);color:#fff;
  clip-path:polygon(22% 0,78% 0,100% 14%,100% 100%,0 100%,0 14%);border-radius:6px;
  box-shadow:0 20px 40px -14px rgba(0,0,0,.6)}
.tag .hole{width:18px;height:18px;border-radius:50%;background:var(--ink);margin:0 auto 14px}
.tag small{display:block;font:500 15px GeistMono;letter-spacing:.16em;opacity:.85}
.tag strong{display:block;font-weight:700;font-size:40px;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.tag em{display:block;font-style:normal;font-size:18px;margin-top:8px;opacity:.9}
.string{position:absolute;height:2px;background:rgba(255,255,255,.65);transform-origin:0 50%}
</style></head><body>
<div id="root"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'card';
const S = n => `../screens/${n}.webp`;
const phone = (src, x, y, w, rot, z=1) =>
  `<div class="phone" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg);z-index:${z}"><img src="${S(src)}"></div>`;
const tape = (x, y, w, rot, start, hit) => {
  let cms = ''; for (let c = start; c < start + Math.ceil(w/50)+1; c++) cms += `<div class="cm${c===hit?' hit':''}"><i>${c}</i></div>`;
  return `<div class="tape" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg)">${cms}</div>`;
};
const tag = (x, y, rot) => `<div class="tag" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg);z-index:9">
  <div class="hole"></div><small>FLASH DEALS</small><strong>04:38:36</strong><em>up to −50% today</em></div>`;
const string = (x, y, len, rot) => `<div class="string" style="left:${x}px;top:${y}px;width:${len}px;transform:rotate(${rot}deg);z-index:8"></div>`;

let html;
if (v === 'card') {
  html = `<div class="stage card">
    ${tape(-40, 862, 1700, -3, 150, 172)}
    <div class="title">
      <div class="kicker">Flutter · iOS · Android · Web</div>
      <div class="word">SILOU<b>.</b></div>
      <div class="line">Fashion &amp; streetwear shopping, from first look to doorstep.</div>
      <div class="meta"><span>23 pieces</span><span>10 brands</span><span>57 tests</span></div>
    </div>
    ${phone('m-product', 790, 150, 330, -9, 2)}
    ${phone('m-courier-map', 1250, 150, 330, 8, 2)}
    ${phone('m-home', 1000, 70, 372, 0, 3)}
    ${string(1300, 96, 120, 30)}
    ${tag(1340, 150, 12)}
  </div>`;
} else {
  html = `<div class="stage banner">
    ${tape(-40, 640, 2000, -2.5, 150, 172)}
    ${phone('m-search', 330, 150, 280, -7, 2)}
    ${phone('m-product', 650, 80, 300, -3, 3)}
    ${phone('m-home', 980, 40, 330, 0, 4)}
    ${phone('m-checkout', 1350, 80, 300, 3, 3)}
    ${phone('m-courier-map', 1680, 150, 280, 7, 2)}
    ${string(190, 70, 150, 22)}
    ${tag(60, 60, -10)}
  </div>`;
}
document.getElementById('root').innerHTML = html;
</script></body></html>
